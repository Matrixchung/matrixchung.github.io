short_bio: >-
  <h6><span aria-hidden="true">👨‍🔬</span> About Me</h6>
  <p>
    I am Xin Zhong, a first-year M.S. student at the <a href="https://me.sjtu.edu.cn/en/" target="_blank" rel="noopener noreferrer">School of Mechanical Engineering</a>, <a href="https://en.sjtu.edu.cn/" target="_blank" rel="noopener noreferrer">Shanghai Jiao Tong University</a> (SJTU). Before that, I received my B.S. degree in Mechanical Engineering from <a href="https://en.uestc.edu.cn/" target="_blank" rel="noopener noreferrer">University of Electronic Science and Technology of China</a> (UESTC) in 2026.
  </p>

  <h6><span aria-hidden="true">🌱</span> Interests</h6>
  <p>
    My research interests focus on <b>Robotics</b> and <b>Embodied Intelligence</b>. With rich experience in mechanical design, embedded electronics and robotic system integration, I work across the complete robotics pipeline from theoretical modeling and algorithm development to hardware implementation and real-world validation. I'm also an active contributor to many open-source projects. <br/>
    I am currently building my foundations in reinforcement learning (with lectures given by <a href="https://github.com/MathFoundationRL/Book-Mathematical-Foundation-of-Reinforcement-Learning" target="_blank" rel="noopener noreferrer">Prof. Shiyu Zhao</a>, and CS285 from UC Berkeley), with a particular interest in its applications to robotics.
  </p>

